---
- name: nextcloud role
  tags: [nextcloud, nextcloud-server]
  block:

  # assert
  - name: Assertions for nextcloud role
    ansible.builtin.assert:
      that:
      - nextcloud_app_dir != None
      - nextcloud_data_dir != None
      - nextcloud_db_pw != None
      - nextcloud_admin_user != None
      - nextcloud_admin_pw != None
      - nextcloud_config_overrides != None
      - nextcloud_linux_user != None

  # install
  - ansible.builtin.import_tasks: install.yml

  # init
  - ansible.builtin.import_tasks: init.yml

  # config
  - ansible.builtin.import_tasks: config.yml