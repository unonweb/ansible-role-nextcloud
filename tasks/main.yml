---
- name: nextcloud role
  tags: [role-nextcloud]
  block:

  # assert
  - name: Assertions for nextcloud role
    ansible.builtin.assert:
      that:
      - nextcloud_app_dir != None
      - nextcloud_data_dir != None
      - nextcloud_db_pw != None
      - nextcloud_admin_user != None
      - nextcloud_admin_pw != None
      - nextcloud_config_overrides != None
      - nextcloud_linux_user != None

  # install
  - ansible.builtin.import_tasks: nextcloud-install.yml

  # init
  - ansible.builtin.import_tasks: nextcloud-init.yml

  # config
  - ansible.builtin.import_tasks: nextcloud-config.yml

  # systemd
  - ansible.builtin.import_tasks: nextcloud-systemd.yml