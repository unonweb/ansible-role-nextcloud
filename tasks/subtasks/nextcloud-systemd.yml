---
- tags: [role-nextcloud-systemd]
  block:

  - name: Template [nextcloud-cron.service, nextcloud-cron.timer]
    become: true
    notify: systemctl --system daemon-reload
    loop:
    - nextcloud-cron.service.j2
    - nextcloud-cron.timer.j2
    ansible.builtin.template:
      src: "{{ item }}"
      dest: "/etc/systemd/system/{{ item.replace('.j2', '') }}"
      owner: root
      group: root
      mode: u=rw,g=r,o=r

  - name: Enable/Start nextcloud-cron.timer
    become: true
    ansible.builtin.systemd_service:
      scope: system
      enabled: true
      state: started
      name: nextcloud-cron.timer